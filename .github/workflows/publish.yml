name: Publish to NPM

on:
  push:
    branches:
      - main
    # Podrías usar tags en lugar de push a main para tener más control:
    # tags:
    #   - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish to NPM
        run: npm publish --provenance --access public
